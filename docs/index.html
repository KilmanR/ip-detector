<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 IP Detector - Surveillance System</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .terminal {
            background: #1a1a1a;
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        
        .header {
            text-align: center;
            border-bottom: 2px solid #00ff00;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
            margin-bottom: 10px;
        }
        
        .line {
            margin: 10px 0;
            font-size: 1.1em;
            min-height: 1.5em;
        }
        
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #00ff00;
            animation: blink 0.5s infinite;
            vertical-align: middle;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        #map {
            height: 600px;
            border: 2px solid #00ff00;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            display: none;
        }
        
        .info-panel {
            background: #1a1a1a;
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }
        
        .info-label {
            font-weight: bold;
            color: #00ffff;
        }
        
        .info-value {
            color: #ffff00;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.5em;
        }
        
        .error {
            color: #ff0000;
            border-color: #ff0000;
        }
        
        .success {
            color: #00ff00;
        }
        
        .warning {
            color: #ffff00;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="terminal">
            <div class="header">
                <h1>🎯 IP DETECTOR</h1>
                <p>СИСТЕМА ГЕОЛОКАЦИОННОГО МОНИТОРИНГА</p>
            </div>
            
            <div id="console">
                <div class="loading">
                    Инициализация системы...<span class="cursor"></span>
                </div>
            </div>
            
            <div id="map"></div>
            
            <div id="info-panel" class="info-panel">
                <h3>📊 ИНФОРМАЦИЯ О ЦЕЛИ</h3>
                <div id="info-content"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Эффект печатной машинки
        async function typeWriter(text, element, speed = 50) {
            const span = document.createElement('span');
            element.appendChild(span);
            
            for (let i = 0; i < text.length; i++) {
                span.innerHTML += text.charAt(i);
                await sleep(speed);
            }
            
            return span;
        }
        
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        function addLine(text, className = '') {
            const console = document.getElementById('console');
            const line = document.createElement('div');
            line.className = 'line ' + className;
            console.appendChild(line);
            typeWriter(text, line, 30);
            return line;
        }
        
        async function initSystem() {
            const console = document.getElementById('console');
            console.innerHTML = '';
            
            await sleep(500);
            addLine('🔐 ИНИЦИАЛИЗАЦИЯ СИСТЕМЫ СЛЕЖЕНИЯ...', 'warning');
            await sleep(800);
            addLine('📡 Подключение к спутникам...', 'warning');
            await sleep(800);
            addLine('🌍 Поиск цели...', 'warning');
            await sleep(1000);
            
            addLine('=' .repeat(60));
            await sleep(500);
            
            try {
                await detectLocation();
            } catch (error) {
                addLine('❌ ОШИБКА СИСТЕМЫ: ' + error.message, 'error');
            }
        }
        
        async function detectLocation() {
            addLine('🎯 Определение местоположения...', 'warning');
            await sleep(1000);
            
            // Получаем IP и геоданные (бесплатный API без токена)
            const response = await fetch('https://ipapi.co/json/');
            
            if (!response.ok) {
                throw new Error('Не удалось получить данные');
            }
            
            const data = await response.json();
            
            addLine('✅ ЦЕЛЬ ОБНАРУЖЕНА', 'success');
            await sleep(300);
            addLine(`🌍 IP АДРЕС: ${data.ip}`, 'success');
            await sleep(300);
            addLine(`📍 ГОРОД: ${data.city}, ${data.region}`, 'success');
            await sleep(300);
            addLine(`🏢 ПРОВАЙДЕР: ${data.org}`, 'success');
            await sleep(300);
            addLine(`📡 КООРДИНАТЫ: ${data.latitude}, ${data.longitude}`, 'success');
            await sleep(300);
            
            addLine('=' .repeat(60));
            await sleep(500);
            
            // Показываем информацию
            showInfo(data);
            await sleep(500);
            
            // Создаём карту
            addLine('🛰️ ГЕНЕРАЦИЯ КАРТЫ СЛЕЖЕНИЯ...', 'warning');
            await sleep(1000);
            
            createMap(data.latitude, data.longitude, data.city);
            
            addLine('✅ ЦЕЛЬ ЗАХВАЧЕНА. КАРТА АКТИВНА', 'success');
            addLine('=' .repeat(60));
        }
        
        function showInfo(data) {
            const panel = document.getElementById('info-panel');
            const content = document.getElementById('info-content');
            
            panel.style.display = 'block';
            
            const info = [
                ['IP Адрес', data.ip],
                ['Город', `${data.city}, ${data.region}`],
                ['Страна', data.country_name],
                ['Провайдер', data.org],
                ['Часовой пояс', data.timezone],
                ['Координаты', `${data.latitude}, ${data.longitude}`]
            ];
            
            content.innerHTML = info.map(([label, value]) => `
                <div class="info-row">
                    <span class="info-label">${label}:</span>
                    <span class="info-value">${value}</span>
                </div>
            `).join('');
        }
        
        function createMap(lat, lon, city) {
            const mapDiv = document.getElementById('map');
            mapDiv.style.display = 'block';
            
            // Создаём карту
            const map = L.map('map').setView([lat, lon], 3);
            
            // Добавляем слой OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19
            }).addTo(map);
            
            // Добавляем спутниковый слой (ESRI)
            const satelliteLayer = L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                {
                    attribution: '© ESRI',
                    maxZoom: 19
                }
            );
            
            // Добавляем маркер
            const marker = L.marker([lat, lon]).addTo(map);
            marker.bindPopup(`<b>🎯 ЦЕЛЬ:</b> ${city}<br><b>📍</b> ${lat}, ${lon}`).openPopup();
            
            // Добавляем круг
            L.circle([lat, lon], {
                color: 'red',
                fillColor: '#f03',
                fillOpacity: 0.3,
                radius: 1000
            }).addTo(map);
            
            // Анимация зума
            setTimeout(() => {
                const zoomLevels = [3, 5, 8, 11, 13, 15];
                let delay = 0;
                
                zoomLevels.forEach((zoom, index) => {
                    setTimeout(() => {
                        map.setView([lat, lon], zoom, {
                            animate: true,
                            duration: 2
                        });
                    }, index * 1500);
                });
            }, 1000);
            
            // Добавляем переключатель слоёв
            const baseMaps = {
                "Карта": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'),
                "Спутник": satelliteLayer
            };
            
            L.control.layers(baseMaps).addTo(map);
        }
        
        // Запускаем при загрузке
        window.onload = initSystem;
    </script>
</body>
</html>
