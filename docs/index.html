<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 IP Detector</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: #0a0a0a; color: #00ff00; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .terminal { background: #1a1a1a; border: 2px solid #00ff00; border-radius: 10px; padding: 30px; }
        .header { text-align: center; border-bottom: 2px solid #00ff00; padding-bottom: 20px; margin-bottom: 20px; }
        .header h1 { font-size: 2.5em; text-shadow: 0 0 10px rgba(0, 255, 0, 0.8); }
        .line { margin: 10px 0; font-size: 1.1em; }
        #map { height: 600px; border: 2px solid #00ff00; border-radius: 10px; margin-top: 20px; display: none; }
        .info-panel { background: #1a1a1a; border: 2px solid #00ff00; border-radius: 10px; padding: 20px; margin-top: 20px; display: none; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #333; }
        .info-label { font-weight: bold; color: #00ffff; }
        .info-value { color: #ffff00; }
        .success { color: #00ff00; }
        .warning { color: #ffff00; }
        .error { color: #ff0000; }
    </style>
</head>
<body>
    <div class="container">
        <div class="terminal">
            <div class="header">
                <h1>🎯 IP DETECTOR</h1>
                <p>СИСТЕМА ГЕОЛОКАЦИИ</p>
            </div>
            <div id="console"></div>
            <div id="map"></div>
            <div id="info-panel" class="info-panel">
                <h3>📊 ИНФОРМАЦИЯ</h3>
                <div id="info-content"></div>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        async function typeWriter(text, element, speed = 50) {
            const span = document.createElement('span');
            element.appendChild(span);
            for (let i = 0; i < text.length; i++) {
                span.innerHTML += text.charAt(i);
                await new Promise(r => setTimeout(r, speed));
            }
        }
        function addLine(text, className = '') {
            const console = document.getElementById('console');
            const line = document.createElement('div');
            line.className = 'line ' + className;
            console.appendChild(line);
            typeWriter(text, line, 30);
        }
        async function initSystem() {
            addLine('🔐 ИНИЦИАЛИЗАЦИЯ...', 'warning');
            await new Promise(r => setTimeout(r, 800));
            addLine('📡 ПОИСК ЦЕЛИ...', 'warning');
            await new Promise(r => setTimeout(r, 1000));
            try { 
                await detectLocation(); 
            } catch (error) { 
                addLine('❌ ОШИБКА: ' + error.message, 'error'); 
            }
        }
        async function detectLocation() {
            addLine('🎯 Определение...', 'warning');
            
            // Пробуем несколько CORS-friendly API
            const apis = [
                'https://ipwho.is/',
                'https://freeipapi.com/api/json',
                'https://api64.ipify.org?format=json'
            ];
            
            let data = null;
            let lastError = null;
            
            for (const api of apis) {
                try {
                    const response = await fetch(api);
                    if (!response.ok) continue;
                    data = await response.json();
                    
                    // Проверяем есть ли координаты
                    if (data.latitude && data.longitude) {
                        break;
                    } else if (data.ip) {
                        // Если только IP, пробуем получить инфо
                        const ip = data.ip;
                        const geoResponse = await fetch(`https://freeipapi.com/api/json/${ip}`);
                        if (geoResponse.ok) {
                            data = await geoResponse.json();
                            break;
                        }
                    }
                } catch (e) {
                    lastError = e;
                    continue;
                }
            }
            
            if (!data) throw new Error('API недоступен');
            
            addLine('✅ ЦЕЛЬ: ' + (data.ip || 'Unknown'), 'success');
            addLine('📍 ' + (data.city || 'Unknown') + ', ' + (data.countryName || 'Unknown'), 'success');
            
            if (data.latitude && data.longitude) {
                addLine('📡 ' + data.latitude + ', ' + data.longitude, 'success');
                showInfo(data);
                createMap(data.latitude, data.longitude, data.city || 'Unknown');
            }
            
            addLine('✅ ГОТОВО', 'success');
        }
        function showInfo(data) {
            const panel = document.getElementById('info-panel');
            const content = document.getElementById('info-content');
            panel.style.display = 'block';
            content.innerHTML = `
                <div class="info-row"><span class="info-label">IP:</span><span class="info-value">${data.ip || 'N/A'}</span></div>
                <div class="info-row"><span class="info-label">Город:</span><span class="info-value">${data.city || 'N/A'}</span></div>
                <div class="info-row"><span class="info-label">Страна:</span><span class="info-value">${data.countryName || 'N/A'}</span></div>
                <div class="info-row"><span class="info-label">Провайдер:</span><span class="info-value">${data.isp || 'N/A'}</span></div>
            `;
        }
        function createMap(lat, lon, city) {
            document.getElementById('map').style.display = 'block';
            const map = L.map('map').setView([lat, lon], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
            L.marker([lat, lon]).addTo(map).bindPopup(`<b>${city}</b>`).openPopup();
            
            // Анимация зума
            setTimeout(() => {
                [5, 8, 11, 13].forEach((z, i) => {
                    setTimeout(() => map.setView([lat, lon], z, { animate: true, duration: 1.5 }), i * 1000);
                });
            }, 500);
        }
        window.onload = initSystem;
    </script>
</body>
</html>
