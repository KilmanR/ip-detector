<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 IP Detector - Surveillance System</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .terminal {
            background: #1a1a1a;
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        
        .header {
            text-align: center;
            border-bottom: 2px solid #00ff00;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
            margin-bottom: 10px;
        }
        
        .line {
            margin: 10px 0;
            font-size: 1.1em;
            min-height: 1.5em;
        }
        
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #00ff00;
            animation: blink 0.5s infinite;
            vertical-align: middle;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        #map {
            height: 600px;
            border: 2px solid #00ff00;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            display: none;
        }
        
        .info-panel {
            background: #1a1a1a;
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }
        
        .info-label {
            font-weight: bold;
            color: #00ffff;
        }
        
        .info-value {
            color: #ffff00;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.5em;
        }
        
        .error {
            color: #ff0000;
            border-color: #ff0000;
        }
        
        .success {
            color: #00ff00;
        }
        
        .warning {
            color: #ffff00;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="terminal">
            <div class="header">
                <h1>🎯 IP DETECTOR</h1>
                <p>СИСТЕМА ГЕОЛОКАЦИОННОГО МОНИТОРИНГА</p>
            </div>
            
            <div id="console">
                <div class="loading">
                    Инициализация системы...<span class="cursor"></span>
                </div>
            </div>
            
            <div id="map"></div>
            
            <div id="info-panel" class="info-panel">
                <h3>📊 ИНФОРМАЦИЯ О ЦЕЛИ</h3>
                <div id="info-content"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Эффект печатной машинки
        async function typeWriter(text, element, speed = 50) {
            const span = document.createElement('span');
            element.appendChild(span);
            
            for (let i = 0; i < text.length; i++) {
                span.innerHTML += text.charAt(i);
                await sleep(speed);
            }
            
            return span;
