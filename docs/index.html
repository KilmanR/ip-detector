<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 IP Detector</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: #0a0a0a; color: #00ff00; }
        .container { max-width: 1000px; margin: 0 auto; padding: 15px; }
        .terminal { background: #1a1a1a; border: 2px solid #00ff00; border-radius: 10px; padding: 20px; }
        .header { text-align: center; border-bottom: 2px solid #00ff00; padding-bottom: 15px; margin-bottom: 15px; }
        .header h1 { font-size: 1.8em; text-shadow: 0 0 10px rgba(0, 255, 0, 0.8); }
        .header p { font-size: 0.9em; margin-top: 5px; }
        .line { margin: 8px 0; font-size: 0.95em; }
        #map { height: 500px; border: 2px solid #00ff00; border-radius: 10px; margin-top: 20px; display: none; }
        .info-panel { background: #1a1a1a; border: 2px solid #00ff00; border-radius: 10px; padding: 15px; margin-top: 15px; display: none; }
        .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #333; font-size: 0.9em; }
        .info-label { font-weight: bold; color: #00ffff; }
        .info-value { color: #ffff00; }
        .success { color: #00ff00; }
        .warning { color: #ffff00; }
        .error { color: #ff0000; }
        
        @media (max-width: 768px) {
            .header h1 { font-size: 1.4em; }
            .header p { font-size: 0.8em; }
            .line { font-size: 0.85em; }
            #map { height: 350px; }
            .info-row { font-size: 0.85em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="terminal">
            <div class="header">
                <h1>🎯 IP DETECTOR</h1>
                <p>СИСТЕМА ГЕОЛОКАЦИИ</p>
            </div>
            <div id="console"></div>
            <div id="map"></div>
            <div id="info-panel" class="info-panel">
                <div id="info-content"></div>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        async function typeWriter(text, element, speed = 40) {
            const span = document.createElement('span');
            element.appendChild(span);
            for (let i = 0; i < text.length; i++) {
                span.innerHTML += text.charAt(i);
                await new Promise(r => setTimeout(r, speed));
            }
        }
        function addLine(text, className = '') {
            const console = document.getElementById('console');
            const line = document.createElement('div');
            line.className = 'line ' + className;
            console.appendChild(line);
            typeWriter(text, line, 40);
        }
        async function initSystem() {
            document.getElementById('console').innerHTML = '';
            document.getElementById('map').style.display = 'none';
            document.getElementById('info-panel').style.display = 'none';
            
            addLine('🔐 ИНИЦИАЛИЗАЦИЯ...', 'warning');
            await new Promise(r => setTimeout(r, 600));
            addLine('📡 ПОИСК ЦЕЛИ...', 'warning');
            await new Promise(r => setTimeout(r, 800));
            try { 
                await detectLocation(); 
            } catch (error) { 
                addLine('❌ ОШИБКА: ' + error.message, 'error');
            }
        }
        async function detectLocation() {
            addLine('🎯 Определение...', 'warning');
            
            const response = await fetch('https://get.geojs.io/v1/ip/geo.json');
            if (!response.ok) throw new Error('API недоступен');
            
            const data = await response.json();
            
            const ip = data.ip || 'Unknown';
            const city = data.city || 'Unknown';
            const country = data.country || 'Unknown';
            const latitude = parseFloat(data.latitude) || 0;
            const longitude = parseFloat(data.longitude) || 0;
            const organization = data.organization || 'Unknown';
            
            addLine('✅ ЦЕЛЬ: ' + ip, 'success');
            addLine('📍 ' + city + ', ' + country, 'success');
            
            if (latitude !== 0 && longitude !== 0) {
                addLine('📡 ' + latitude + ', ' + longitude, 'success');
                addLine('🏢 ' + organization, 'success');
                showInfo({ip, city, country, latitude, longitude, organization});
                
                await new Promise(r => setTimeout(r, 500));
                await createMap(latitude, longitude, city);
            }
            
            addLine('✅ ГОТОВО', 'success');
        }
        function showInfo(data) {
            const panel = document.getElementById('info-panel');
            const content = document.getElementById('info-content');
            panel.style.display = 'block';
            content.innerHTML = `
                <div class="info-row"><span class="info-label">IP:</span><span class="info-value">${data.ip}</span></div>
                <div class="info-row"><span class="info-label">Город:</span><span class="info-value">${data.city}</span></div>
                <div class="info-row"><span class="info-label">Страна:</span><span class="info-value">${data.country}</span></div>
                <div class="info-row"><span class="info-label">Провайдер:</span><span class="info-value">${data.organization}</span></div>
            `;
        }
        async function createMap(lat, lon, city) {
            const mapDiv = document.getElementById('map');
            mapDiv.style.display = 'block';
            
            const map = L.map('map').setView([lat, lon], 2);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
                attribution: '© OpenStreetMap',
                maxZoom: 19 
            }).addTo(map);
            
            const marker = L.marker([lat, lon]).addTo(map);
            marker.bindPopup(`<b>🎯 ${city}</b>`).openPopup();
            
            L.circle([lat, lon], {
                color: 'red',
                fillColor: '#f03',
                fillOpacity: 0.3,
                radius: 1000
            }).addTo(map);
            
            // Плавная анимация зума как в Enterprise
            const zoomLevels = [2, 4, 6, 8, 10, 12, 14, 15];
            for (let i = 0; i < zoomLevels.length; i++) {
                await new Promise(r => setTimeout(r, 800));
                map.setView([lat, lon], zoomLevels[i], { 
                    animate: true, 
                    duration: 1.5,
                    easeLinearity: 0.25
                });
            }
            
            return map;
        }
        window.onload = initSystem;
    </script>
</body>
</html>
